      primary: true
  repositories:
    - name: starshield-forensics
      url: https://github.com/Ziqi/starshield-forensics
      comment: >
        Core deterministic Chromium IndexedDB/LevelDB .log carver, PNG/JPEG ICC
        container provenance inspector, ISO-13616/Luhn checksum validator, and
        StarShield-Bench-24 suite.
    - name: starshield
      url: https://github.com/Ziqi/starshield
      comment: >
        Zero-telemetry static documentation portal and synthetic triage
