  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Ziqi Xiao
      email: 2196305+Ziqi@users.noreply.github.com
      primary: true
    security-policy: https://github.com/Ziqi/starshield-forensics/blob/main/SECURITY.md
    in-scope:
      - parser memory exhaustion or decompression-bomb bounds bypass
      - Castagnoli CRC32C or LevelDB WriteBatch framing validation bypass
      - default keyed HMAC pseudonymization or failure-path stderr leakage
      - build reproducibility or cryptographic release attestation flaw
    out-of-scope:
      - local resource exhaustion requiring explicit --max-mb override
      - social engineering
    comment: >
      Report security vulnerabilities privately via GitHub Private Vulnerability
      Reporting (https://github.com/Ziqi/starshield-forensics/security/advisories/new)
      with a 48-hour acknowledgment SLA.
  documentation:
