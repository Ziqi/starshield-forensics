name: Bug Report
description: Report a reproducible defect or documentation discrepancy in starshield-forensics
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem Description & Minimal Reproduction
      description: Describe observed vs. expected behavior (use clean-room synthetic inputs only — never attach live case evidence). Never include private keys, real incident PII, or live credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit & Environment
      placeholder: "e.g., latest release, Ubuntu 24.04 / macOS 15, Python 3.12"
    validations:
      required: true
