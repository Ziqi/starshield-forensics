name: StarShield Deterministic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: FSFE REUSE 3.2/3.3 Licensing & Copyright Compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate OpenSSF SECURITY-INSIGHTS.yml & SPDX 2.3 SBOM Determinism
        run: |
          python -m pip install --upgrade pip pyyaml
          python -c "import yaml; d=yaml.safe_load(open('SECURITY-INSIGHTS.yml')); assert d['header']['schema-version']=='2.0.0' and d['repository']['no-third-party-packages'] is True"
          python scripts/build_reproducible.py --verify --output /tmp/starshield.pyz
          python scripts/generate_spdx_sbom.py --verify --verify-pyz /tmp/starshield.pyz --output /tmp/starshield-forensics-0.3.7.spdx.json

  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build, coverage, lint & static security tools
        run: python -m pip install --upgrade pip "setuptools>=77" wheel coverage ruff bandit
      - name: Enforce coding standards (Ruff) & static vulnerability scan (Bandit)
        run: |
          ruff check starshield tests benchmark scripts
          bandit -q -r starshield scripts
      - name: Run unit & adversarial tests under strict warnings + >=80% statement coverage gate
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -W error -m coverage run -m unittest discover -s tests -v
          python -m coverage report --include="starshield/*" --fail-under=80
      - name: Run StarShield-Bench-24 deterministic benchmark & cross-tool validation harness
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -W error benchmark/benchmark_suite.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -W error scripts/verify_cross_tool_forensics.py
      - name: Verify bit-for-bit reproducible zipapp build
        run: |
          python scripts/build_reproducible.py --verify --output dist/starshield.pyz
          python dist/starshield.pyz demo > /tmp/pyz_demo.json
          python -c "import json; d=json.load(open('/tmp/pyz_demo.json')); assert d['engine_1_raw_leveldb_wal_carver']['corrupted_frames_count'] == 0"
      - name: Build wheel and verify installed CLI entrypoint outside repo tree
        run: |
          python -m pip wheel . --no-deps -w dist/
          python -m pip install dist/*.whl
          cd /tmp && starshield demo > /tmp/demo_out.json
          python -c "import json; d=json.load(open('/tmp/demo_out.json')); assert d['engine_1_raw_leveldb_wal_carver']['corrupted_frames_count'] == 0"
          mkdir -p /tmp/precheck_smoke && starshield precheck /tmp/precheck_smoke > /tmp/pre_out.json
          python -c "import json; p=json.load(open('/tmp/pre_out.json')); assert p['precheck_manifest']['feasibility_verdict'] == 'NO_GO_COMPACTED_OR_UNSUPPORTED'"
