name: Supply-Chain Attestations & SLSA Level 3 Provenance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attest and attach SLSA L3 provenance to"
        required: false
        default: "v0.3.8"
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      subjects_b64: ${{ steps.subjects.outputs.subjects_b64 }}
      release_tag: ${{ steps.subjects.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build reproducible zipapp, verify pinned release digests & generate SPDX 2.3 SBOM
        id: subjects
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG:-v0.3.8}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag format: $TAG" >&2
            exit 1
          fi

          mkdir -p dist
          python scripts/build_reproducible.py --verify --output dist/starshield.pyz
          echo "394f8e0208aae3e87751c8dd8e6c820ea13c5d896b62e39315c24018ad573c99  dist/starshield.pyz" | sha256sum -c -

          curl -fsSL -o dist/starshield_forensics-0.3.8-py3-none-any.whl \
            "https://github.com/Ziqi/starshield-forensics/releases/download/${TAG}/starshield_forensics-0.3.8-py3-none-any.whl"
          curl -fsSL -o dist/starshield_forensics-0.3.8.tar.gz \
            "https://github.com/Ziqi/starshield-forensics/releases/download/${TAG}/starshield_forensics-0.3.8.tar.gz"

          cat <<'EOF' | sha256sum -c -
          6f1e045be023b7acd4b3e6f4bf4e4cfce392639bb8b88f1e351369daf13ed817  dist/starshield_forensics-0.3.8-py3-none-any.whl
          87afc0617eedd5a760a5ddfb7ab5ba002dc930ff25db7ad7cd2d8bd115e19325  dist/starshield_forensics-0.3.8.tar.gz
          EOF

          python scripts/generate_spdx_sbom.py \
            --verify \
            --verify-pyz dist/starshield.pyz \
            --output dist/starshield-forensics-0.3.8.spdx.json

          B64="$(cd dist && sha256sum \
            starshield.pyz \
            starshield_forensics-0.3.8-py3-none-any.whl \
            starshield_forensics-0.3.8.tar.gz \
            starshield-forensics-0.3.8.spdx.json | base64 -w0)"
          echo "subjects_b64=${B64}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Attest artifact build provenance (Sigstore Fulcio + Rekor)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/starshield.pyz
            dist/starshield_forensics-0.3.8-py3-none-any.whl
            dist/starshield_forensics-0.3.8.tar.gz
            dist/starshield-forensics-0.3.8.spdx.json

      - name: Attest SPDX 2.3 SBOM (Sigstore Fulcio + Rekor)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/starshield.pyz
            dist/starshield_forensics-0.3.8-py3-none-any.whl
            dist/starshield_forensics-0.3.8.tar.gz
          sbom-path: dist/starshield-forensics-0.3.8.spdx.json

      - name: Upload deterministic SPDX 2.3 SBOM workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starshield-spdx-sbom
          path: dist/starshield-forensics-0.3.8.spdx.json
          if-no-files-found: error
          retention-days: 30

  slsa3-provenance:
    needs: [build-and-attest]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build-and-attest.outputs.subjects_b64 }}"
      upload-assets: true
      upload-tag-name: "${{ needs.build-and-attest.outputs.release_tag }}"
      provenance-name: "multiple.intoto.jsonl"
