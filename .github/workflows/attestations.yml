name: Supply-Chain Attestations & SLSA Level 3 Provenance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attest and attach SLSA L3 provenance to"
        required: false
        default: "v0.3.10"
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      subjects_b64: ${{ steps.subjects.outputs.subjects_b64 }}
      release_tag: ${{ steps.subjects.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build reproducible zipapp, verify signed release digests & generate SPDX 2.3 SBOM
        id: subjects
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG:-v0.3.10}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag format: $TAG" >&2
            exit 1
          fi
          VER="${TAG#v}"
          BASE_URL="https://github.com/Ziqi/starshield-forensics/releases/download/${TAG}"
          WHL_NAME="starshield_forensics-${VER}-py3-none-any.whl"
          SDIST_NAME="starshield_forensics-${VER}.tar.gz"
          SBOM_NAME="starshield-forensics-${VER}.spdx.json"

          mkdir -p dist /tmp/release-sig
          python scripts/build_reproducible.py --verify --output dist/starshield.pyz
          if [[ "$TAG" == "v0.3.10" ]]; then
            echo "c2ab9034d9e5aaeff4a2f16250261dff58d49233edcfeb91ab799d7898e6f3e0  dist/starshield.pyz" | sha256sum -c -
          fi

          curl -fsSL -o /tmp/release-sig/SHA256SUMS "${BASE_URL}/SHA256SUMS"
          curl -fsSL -o /tmp/release-sig/SHA256SUMS.sig "${BASE_URL}/SHA256SUMS.sig"
          curl -fsSL -o "dist/${WHL_NAME}" "${BASE_URL}/${WHL_NAME}"
          curl -fsSL -o "dist/${SDIST_NAME}" "${BASE_URL}/${SDIST_NAME}"

          ssh-keygen -Y verify \
            -f KEYS.pub \
            -I "2196305+Ziqi@users.noreply.github.com" \
            -n file \
            -s /tmp/release-sig/SHA256SUMS.sig < /tmp/release-sig/SHA256SUMS

          (
            cd dist
            for req_asset in "starshield.pyz" "${WHL_NAME}" "${SDIST_NAME}"; do
              line="$(awk -v target="$req_asset" 'length($1) == 64 && $1 ~ /^[0-9a-f]+$/ && ($2 == target || $2 == ("*" target)) && NF == 2 { print; exit }' /tmp/release-sig/SHA256SUMS)"
              if [[ -z "$line" ]]; then
                echo "Missing required SHA256SUMS entry for ${req_asset}" >&2
                exit 1
              fi
              printf '%s\n' "$line" | sha256sum -c -
            done
          )

          python scripts/generate_spdx_sbom.py \
            --verify \
            --verify-pyz dist/starshield.pyz \
            --wheel "dist/${WHL_NAME}" \
            --sdist "dist/${SDIST_NAME}" \
            --require-dists \
            --output "dist/${SBOM_NAME}"

          B64="$(cd dist && sha256sum \
            starshield.pyz \
            "${WHL_NAME}" \
            "${SDIST_NAME}" \
            "${SBOM_NAME}" | base64 -w0)"
          echo "subjects_b64=${B64}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Attest artifact build provenance (Sigstore Fulcio + Rekor)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/starshield.pyz
            dist/starshield_forensics-${{ steps.subjects.outputs.ver }}-py3-none-any.whl
            dist/starshield_forensics-${{ steps.subjects.outputs.ver }}.tar.gz
            dist/starshield-forensics-${{ steps.subjects.outputs.ver }}.spdx.json

      - name: Attest SPDX 2.3 SBOM (Sigstore Fulcio + Rekor)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/starshield.pyz
            dist/starshield_forensics-${{ steps.subjects.outputs.ver }}-py3-none-any.whl
            dist/starshield_forensics-${{ steps.subjects.outputs.ver }}.tar.gz
          sbom-path: dist/starshield-forensics-${{ steps.subjects.outputs.ver }}.spdx.json

      - name: Upload deterministic SPDX 2.3 SBOM workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starshield-spdx-sbom
          path: dist/starshield-forensics-${{ steps.subjects.outputs.ver }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  slsa3-provenance:
    needs: [build-and-attest]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build-and-attest.outputs.subjects_b64 }}"
      upload-assets: true
      upload-tag-name: "${{ needs.build-and-attest.outputs.release_tag }}"
      provenance-name: "multiple.intoto.jsonl"
