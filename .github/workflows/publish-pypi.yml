name: Publish to Official PyPI (OIDC Trusted Publisher + PEP 740 Attestations)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Signed GitHub Release tag whose canonical wheel/sdist will be published"
        required: false
        default: "v0.3.8"
        type: string

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run unit, benchmark & UK FSR / ISO 17025 cross-validation gates
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -W error -m unittest discover -s tests -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -W error benchmark/benchmark_suite.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -W error scripts/verify_cross_tool_forensics.py
      - name: Fetch & cryptographically verify canonical signed release distributions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || 'v0.3.8' }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag format: ${RELEASE_TAG}" >&2
            exit 1
          fi
          VER="${RELEASE_TAG#v}"
          BASE_URL="https://github.com/Ziqi/starshield-forensics/releases/download/${RELEASE_TAG}"
          WHL_NAME="starshield_forensics-${VER}-py3-none-any.whl"
          SDIST_NAME="starshield_forensics-${VER}.tar.gz"

          mkdir -p /tmp/release-verify dist
          curl -fsSL "${BASE_URL}/SHA256SUMS" -o /tmp/release-verify/SHA256SUMS
          curl -fsSL "${BASE_URL}/SHA256SUMS.sig" -o /tmp/release-verify/SHA256SUMS.sig
          curl -fsSL "${BASE_URL}/${WHL_NAME}" -o "/tmp/release-verify/${WHL_NAME}"
          curl -fsSL "${BASE_URL}/${SDIST_NAME}" -o "/tmp/release-verify/${SDIST_NAME}"

          ssh-keygen -Y verify \
            -f KEYS.pub \
            -I "2196305+Ziqi@users.noreply.github.com" \
            -n file \
            -s /tmp/release-verify/SHA256SUMS.sig < /tmp/release-verify/SHA256SUMS

          (
            cd /tmp/release-verify
            grep -E "  (${WHL_NAME}|${SDIST_NAME})$" SHA256SUMS | sha256sum -c -
          )

          if [[ "${RELEASE_TAG}" == "v0.3.8" ]]; then
            sha256sum -c - <<'EOF'
          6f1e045be023b7acd4b3e6f4bf4e4cfce392639bb8b88f1e351369daf13ed817  /tmp/release-verify/starshield_forensics-0.3.8-py3-none-any.whl
          87afc0617eedd5a760a5ddfb7ab5ba002dc930ff25db7ad7cd2d8bd115e19325  /tmp/release-verify/starshield_forensics-0.3.8.tar.gz
          EOF
          fi

          cp "/tmp/release-verify/${WHL_NAME}" "dist/${WHL_NAME}"
          cp "/tmp/release-verify/${SDIST_NAME}" "dist/${SDIST_NAME}"
          ls -la dist/
      - name: Publish canonical distributions to PyPI with PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true
          skip-existing: true
