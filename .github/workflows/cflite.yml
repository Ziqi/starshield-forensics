name: Continuous Fuzzing (ClusterFuzzLite & Atheris)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-fuzz-gate:
    name: Deterministic Structure-Aware Fuzz Campaign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run 2,500 structure-aware binary & checksum fuzz iterations (zero deps)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -W error tests/fuzz_parsers.py --stdlib --iterations 2500

  cflite-pr:
    name: ClusterFuzzLite Atheris Coverage Fuzzing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build Atheris Fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          sanitizer: ${{ matrix.sanitizer }}
          language: python
      - name: Run Atheris Fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 30
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
