[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "starshield-forensics"
version = "0.3.5"
description = "Deterministic, offline Chromium IndexedDB/LevelDB write-ahead log (.log) record carver, PNG/JPEG ICC container provenance inspector, and multi-jurisdiction financial checksum validator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  {name = "Ziqi Xiao"}
]
keywords = [
  "digital-forensics",
  "dfir",
  "leveldb",
  "indexeddb",
  "png-metadata",
  "iban-validator",
  "evidence-triage"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security"
]

[project.urls]
Homepage = "https://ziqi.github.io/starshield/"
Repository = "https://github.com/Ziqi/starshield-forensics"

[project.scripts]
starshield = "starshield.cli:main"

[tool.setuptools]
packages = ["starshield", "starshield.data"]

[tool.setuptools.package-data]
"starshield.data" = ["*.json"]
